name: cps_universe_and_topcode
known_input_columns: [AGE, CLASSWLY, YEAR, INCWAGE]
validate_between_steps: true

# Run-level strictness (separate from  `uncovered_years` methodology policy).
#  - false is the gaps this pipeline are documented  (e.g., CPI/GDP-PCE tables
#    have no 1962 entry and stop at 2008.
#  - true for a run that should abort on any step warning.
fail_on_warning: false

steps:
  - name: age_band_filter
    type: BandFilter
    column: AGE
    min_value: 16

  - name: wage_or_self_employed_filter
    type: MembershipFilter
    column: CLASSWLY
    allowed_values: [20, 22, 24, 25, 27, 28, 10, 13, 14]

  - name: age_topcode
    type: TopcodeCapStep
    column: AGE
    ceiling: 90

  - name: wage_topcode
    type: TopcodeAdjuster
    column: INCWAGE
    topcode_key: wage

  - name: deflator_merge
    type: DeflatorMergeStep
    cpi_key: cpi
    gdp_key: gdp_pce
