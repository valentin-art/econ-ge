name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write


concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

  claude-pr-review:
      if: >
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.changed_files < 40
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pull-requests: write
        issues: read
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
  
        - name: Run Claude Code Review
          uses: anthropics/claude-code-action@v1
          with:
            claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            claude_args: "--max-turns 8"
            prompt: |
              Review this pull request diff against the conventions in CLAUDE.md.

  
              Focus on:
              - Business logic leaking into Dagster assets or dbt models
              - Hardcoded paths, hosts, or credentials instead of
                pydantic-settings / env vars
              - Missing or weakened patito schema validation at layer
                boundaries (Bronze -> Silver -> Postgres)
              - Silent branching / swallowed exceptions instead of explicit
                assertions and diagnostic blocks
              - Correctness bugs, not style nits already covered by ruff/mypy

              Categorize each finding by severity: Blocker | Major | Minor | Nit
              Severety Guidance
              - Blocker: Definite bug, security/safety flaw, data loss, or API break
              - Major: Likely bug, large performance/memory issue, confusing API, flaky behavior
              - Minor: Readability, small performance/style issues, incomplete doc/types
              - Nit: Tiny consistency/style suggestions
              
              Post inline comments on the specific lines with issues. If
              nothing significant is found, post a short confirmation instead
              of listing minor style preferences.
