[project]
name = "econ-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "polars>=1.0",
    "pyarrow>=18.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pytest>=9.0.3",
    "structlog>=24.0",
]
[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "ipykernel", "jupyterlab"]

[tool.uv.workspace]
members = [
    "econ-ge",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
