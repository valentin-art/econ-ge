[project]
name = "econ-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beaapi>=0.2.0",
    "click>=8.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "patito>=0.8.6",
    "polars>=1.0",
    "psycopg>=3.3.4",
    "pyarrow>=18.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "structlog>=24.0",
]
[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "ipykernel", "jupyterlab"]

[tool.uv.workspace]
members = [
    "econ-ge",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
